apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: neurodesk-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/websocket-services: neurodesk-service
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.neurodesk.ai
    secretName: neurodesk-tls
  rules:
  - host: api.neurodesk.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: neurodesk-service
            port:
              number: 8000
